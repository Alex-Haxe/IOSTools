name: Range Merge Commits

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to merge into'
        required: true
        type: string
      oldest_commit:
        description: 'Starting commit SHA (exclusive boundary)'
        required: true
        type: string
      newest_commit:
        description: 'Ending commit SHA (inclusive boundary)'
        required: true
        type: string
      commit_message:
        description: 'Base message for the final merge'
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@://github.com"

      - run: |
          git checkout "${{ github.event.inputs.target_branch }}"
          
          COMMITS=$(git rev-list --reverse "${{ github.event.inputs.oldest_commit }}..${{ github.event.inputs.newest_commit }}")
          
          for commit in $COMMITS; do
            git merge "$commit" -m "${{ github.event.inputs.commit_message }} - Step: $commit" --no-ff
          done
          
          git push origin "${{ github.event.inputs.target_branch }}"
          
